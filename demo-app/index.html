<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦜</text></svg>" />
    <title>🦜 Pivot Parrot Demo</title>
    <script>
      // Seed data-theme before first paint so the shell never flashes unthemed.
      // Stored choice wins; otherwise follow the OS. The pivot toolbar's theme
      // toggle owns changes after this.
      (function () {
        var stored = localStorage.getItem('pp-theme');
        document.documentElement.dataset.theme =
          stored === 'dark' || stored === 'light'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
